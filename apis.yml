aid: johns-hopkins-university
name: Johns Hopkins University
x-type: university
x-category: Private Research University
description: >-
  Johns Hopkins University is a private research university in Baltimore, Maryland, founded in 1876 and
  ranked #21 in the QS World University Rankings 2026. Its programmable footprint is small but real and,
  unusually for this cohort, it is genuinely its own: Johns Hopkins operates three APIs on hosts under its
  own registrable domains and publishes two live machine-readable identity artifacts. The Hub API
  (api.hub.jhu.edu) serves news, announcements, events, photo galleries and faculty experts from the Hub
  database across fifteen resource families, and the Self-Service Public Course Search API
  (sis.jhu.edu/api) returns course catalog data as JSON; both are documented in public but issue keys only
  to Johns Hopkins affiliates. A MuleSoft Anypoint portal at api.jh.edu fronts integration APIs and is
  gated entirely. Beyond those, the institution runs a Shibboleth SAML 2.0 identity provider whose
  metadata it publishes itself at login.jh.edu and which is registered in the InCommon Federation with
  Research and Scholarship and SIRTFI attributes; Project MUSE, operated by Johns Hopkins University
  Press, answers OAI-PMH 2.0 over 897,938 harvestable records with no authentication at all — the only
  fully open machine-readable surface the university has. The Johns Hopkins Research Data Repository
  (archive.data.jhu.edu) is Dataverse software administered by JHU Data Services, and the university's
  research portal at pure.johnshopkins.edu is an Elsevier Pure tenancy: both hold Johns Hopkins data, and
  neither contract is Johns Hopkins engineering. No central public developer portal, no changelog, no
  deprecation policy and no working status page exist for any of it.
