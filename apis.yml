  detail: >-
    Johns Hopkins publishes three institution-operated APIs, two institution-operated SAML identity
    artifacts and one fully open OAI-PMH repository, all verified live by direct probe on 2026-08-19. The
    profile is genuinely thin rather than under-researched: the two documented APIs gate key issuance to
    Johns Hopkins affiliates, the MuleSoft portal is gated entirely, and no central public developer
    portal exists. PARTIAL BLOCKING is the one caveat and it is about US, not about them: Cloudflare bot
    management returns 403 to automated clients across the university's WordPress estate
    (www.jhu.edu, ai.jhu.edu, it.johnshopkins.edu, teaching.jhu.edu, press.jhu.edu) and across
    jscholarship.library.jhu.edu and archive.data.jhu.edu, so the OAI-PMH endpoint that re3data records
    for the Johns Hopkins Research Data Repository could not be exercised from here. Those hosts grade
    LIVE, not dead. A negative probe was run before crediting any vendor tenancy: zzznotarealtenant.
    figshare.com resolves and answers 202 exactly as jhu.figshare.com does, so the Figshare DNS record is
    a wildcard and is NOT evidence of a Johns Hopkins Figshare tenancy — none is claimed.
