- aid: johns-hopkins-university:research-data-repository
  name: Johns Hopkins Research Data Repository
  description: >-
    Institutional research data repository at archive.data.jhu.edu, administered by Johns Hopkins University
    Data Services within the Sheridan Libraries, running Dataverse software and minting DOIs through the
    institution's own DataCite account (repository symbol JHU.DS under provider JHU). re3data records
    an OAI-PMH endpoint at /oai. NO CONTRACT IS SAVED HERE: the REST and OAI-PMH interfaces are the Dataverse
    Project's, not Johns Hopkins engineering, and saving them under this slug is precisely the misattribution
    this pipeline exists to prevent. The repository, the data and the DOIs are the institution's; the
    API contract is not.
  humanURL: https://archive.data.jhu.edu/
  baseURL: https://archive.data.jhu.edu
  x-operator: institution
  x-operator-basis: >-
    archive.data.jhu.edu is under the institution's own registrable domain jhu.edu and is administered
    by JHU Data Services. Dataverse supplies the software; the contract belongs to the Dataverse Project
    and is deliberately not saved under this institution.
  x-software: Dataverse
  x-contract-owner: The Dataverse Project
