- aid: johns-hopkins-university:pure-research-portal
  name: Johns Hopkins Research Portal (Elsevier Pure tenancy)
  description: >-
    The Johns Hopkins research information portal at pure.johnshopkins.edu, which CNAMEs to jhu.elsevierpure.com.
    This is an Elsevier Pure tenancy: the researcher profiles, publications and organizational data are
    Johns Hopkins', the platform and every API contract on it are Elsevier's. Recorded as a TENANT relationship,
    which is a real institutional fact worth keeping. Pure's own web services (/ws/rest, /ws/api, /ws/oai)
    all answer 401 — deployed but closed to the public. No Elsevier contract is saved under this institution.
  humanURL: https://pure.johnshopkins.edu/
  baseURL: https://pure.johnshopkins.edu
  x-operator: tenant
  x-operator-basis: >-
    pure.johnshopkins.edu is a CNAME to jhu.elsevierpure.com — an institution-specific account on a vendor
    platform. The data is Johns Hopkins'; the contract is Elsevier's and belongs against Elsevier's own
